[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "sentinel-x"
version = "0.1.0"
description = "Linux/systemd evidence research framework for falsifiable operational reasoning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []


[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "ruff==0.16.2",
]


[project.scripts]
sentinel-x = "sentinel_x.cli:main"


[tool.setuptools.packages.find]
where = ["src"]
include = ["sentinel_x*"]


[tool.ruff]
target-version = "py311"
line-length = 88


[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.mypy]
python_version = "3.11"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
warn_unused_configs = true
