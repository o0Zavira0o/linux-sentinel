name: Sentinel-X Quality

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools

      - name: Install Sentinel-X development environment
        run: |
          python -m pip install -e ".[dev]"

      - name: Run Sentinel-X quality gate
        run: |
          ./scripts/check.sh
